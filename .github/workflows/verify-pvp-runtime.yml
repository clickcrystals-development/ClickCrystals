name: Verify PvP Runtime (Minecraft 1.21.11)

on:
  push:
    branches:
      - fix/pvp-runtime-2026-11-08
  pull_request:
    branches:
      - dev/1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-package:
    name: Java 21 / Fabric 1.21.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build
      - name: Upload development JAR (not gameplay-verified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClickCrystals-Modified-PvP-1.21.11-dev
          path: build/libs/*.jar
          if-no-files-found: error
