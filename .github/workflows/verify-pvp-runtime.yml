name: Verify PvP Runtime (Minecraft 1.21.11)

on:
  push:
    branches:
      - fix/pvp-runtime-2026-11-08
      - feat/omnikit-runtime-foundation-12111
  pull_request:
    branches:
      - dev/1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-package:
    name: Java 21 / Fabric 1.21.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependency-free runtime regression tests
        shell: bash
        run: |
          mkdir -p build/runtime-tests
          javac --release 21 -d build/runtime-tests \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/AsyncDecisionBridge.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/ScriptExecutionBudget.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/InputLeaseManager.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/SelectionHistory.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/PlayerInventorySlotMap.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/TickTaskQueue.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/KeyGestureTracker.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/ScriptExtensions.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/runtime/nav/IncrementalPathfinder.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/ScriptState.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/ScriptComments.java \
            src/main/java/io/github/itzispyder/clickcrystals/scripting/SenseCompare.java \
            src/main/java/io/github/itzispyder/clickcrystals/client/system/VersionStrings.java \
            tests/*.java
          for test in AsyncDecisionBridgeTest ScriptExecutionBudgetTest InputLeaseManagerTest SelectionHistoryTest PlayerInventorySlotMapTest \
            TickTaskQueueTest KeyGestureTrackerTest ScriptExtensionsTest \
            IncrementalPathfinderTest ScriptStateSmokeTest ScriptCommentsSmokeTest \
            SenseCompareSmokeTest VersionStringsSmokeTest; do
            java -cp build/runtime-tests "$test"
          done
      - name: Compile and package Fabric mod
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace build
      - name: Upload development JAR (not gameplay-verified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClickCrystals-Modified-PvP-1.21.11-dev
          path: build/libs/*.jar
          if-no-files-found: error
